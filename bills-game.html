<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Goal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700;800&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Source Sans 3', system-ui, sans-serif;
  background: #001A3E;
  color: #fff;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.site-header {
  background: #003087;
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}
.back-link {
  color: #FFB81C;
  text-decoration: none;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.back-link:hover { text-decoration: underline; }
.header-label {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* Title area */
.game-title-bar {
  text-align: center;
  padding: 1.25rem 1rem 0.5rem;
}
.game-title-bar h1 {
  font-size: clamp(1.5rem, 5vw, 2.6rem);
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #FFB81C;
  line-height: 1;
  text-shadow: 0 3px 18px rgba(0,0,0,0.7);
}
.game-title-bar p {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.4);
  margin-top: 0.3rem;
}

/* HUD */
.hud {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  padding: 0.5rem 1rem 0.75rem;
}
.hud-group { text-align: center; }
.hud-label {
  display: block;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 0.1rem;
}
.hud-val {
  display: block;
  font-size: 1.6rem;
  font-weight: 700;
  color: #FFB81C;
  font-variant-numeric: tabular-nums;
  min-width: 2.5ch;
}

/* Canvas container */
.canvas-wrap {
  display: flex;
  justify-content: center;
  padding: 0 0.75rem;
}
canvas {
  display: block;
  border: 2px solid rgba(255,184,28,0.18);
  border-radius: 3px;
  max-width: 100%;
}

/* Instruction strip */
.instr {
  text-align: center;
  font-size: 0.78rem;
  color: rgba(255,255,255,0.38);
  padding: 0.5rem 1rem 0;
  min-height: 1.4rem;
  letter-spacing: 0.02em;
}
.instr strong { color: #FFB81C; }

/* Overlay / Result */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,4,20,0.9);
  z-index: 50;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.overlay.open { display: flex; }
.result-box {
  background: #071E52;
  border: 2px solid #FFB81C;
  border-radius: 4px;
  padding: 2rem 2.5rem;
  text-align: center;
  max-width: 420px;
  width: 100%;
  animation: popUp 0.22s ease;
}
@keyframes popUp {
  from { opacity: 0; transform: scale(0.9) translateY(12px); }
  to   { opacity: 1; transform: none; }
}
.result-emoji { font-size: 3rem; margin-bottom: 0.5rem; }
.result-title {
  font-size: 1.5rem;
  font-weight: 800;
  color: #FFB81C;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 0.35rem;
}
.result-sub {
  font-size: 0.9rem;
  color: rgba(255,255,255,0.55);
  margin-bottom: 1.5rem;
  line-height: 1.5;
}
.next-btn, .play-again-btn {
  background: #FFB81C;
  color: #003087;
  border: none;
  font-family: inherit;
  font-weight: 800;
  font-size: 0.88rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.75rem 2rem;
  border-radius: 2px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.next-btn:hover, .play-again-btn:hover { opacity: 0.86; }

.score-history {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}
.kick-chip {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.28rem 0.65rem;
  border-radius: 100px;
  letter-spacing: 0.06em;
}
.chip-good { background: #1B7A40; color: #fff; }
.chip-miss { background: #7A1B1B; color: #fff; }
.chip-pending { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="back-link">&larr; Dr. Lee's Page</a>
  <span class="header-label">Bills Mafia</span>
</header>

<div class="game-title-bar">
  <h1>Mafia Goal</h1>
  <p>Buffalo Bills field goal challenge &middot; 5 kicks &middot; 3 pts each</p>
</div>

<div class="hud">
  <div class="hud-group">
    <span class="hud-label">Score</span>
    <span class="hud-val" id="hud-score">0</span>
  </div>
  <div class="hud-group">
    <span class="hud-label">Kick</span>
    <span class="hud-val" id="hud-kick">1 / 5</span>
  </div>
</div>

<div class="canvas-wrap">
  <canvas id="gc" width="680" height="360"></canvas>
</div>
<div class="instr" id="instr">Click to set <strong>power</strong></div>

<!-- Per-kick result -->
<div class="overlay" id="kick-overlay">
  <div class="result-box">
    <div class="result-emoji" id="k-emoji"></div>
    <div class="result-title" id="k-title"></div>
    <div class="result-sub" id="k-sub"></div>
    <button class="next-btn" id="next-btn">Next Kick →</button>
  </div>
</div>

<!-- Game over -->
<div class="overlay" id="end-overlay">
  <div class="result-box">
    <div class="result-emoji" id="e-emoji"></div>
    <div class="result-title" id="e-title"></div>
    <div class="result-sub" id="e-sub"></div>
    <div class="score-history" id="e-hist"></div>
    <button class="play-again-btn" onclick="startGame()">Play Again</button>
  </div>
</div>

<script>
const cvs = document.getElementById('gc');
const ctx = cvs.getContext('2d');

const W = cvs.width, H = cvs.height;
const KICKS = 5, PTS = 3;

const BLUE  = '#003087';
const GOLD  = '#FFB81C';
const GREEN = '#1A5C2A';
const WHITE = '#FFFFFF';

let phase = 'idle'; // idle | power | accuracy | flying | done
let power = 0, powerDir = 1;
let accuracy = 0, accDir = 1;
let kickNum = 0, score = 0;
let results = [];
let animId = null;
let ballX, ballY, targetX, targetY, ballT;
let kickGood = false;

const BAR_X = 60, BAR_Y = H - 55, BAR_W = W - 120, BAR_H = 16;
const POST_X = W / 2, POST_Y = 60, POST_H = 100, POST_W = 80;
const BALL_START_X = W / 2, BALL_START_Y = H - 85;

function lerp(a, b, t) { return a + (b - a) * t; }

// ---- Draw ----
function drawField() {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#0A0F24');
  sky.addColorStop(1, '#0D2060');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.55);

  // grass
  const grass = ctx.createLinearGradient(0, H * 0.55, 0, H);
  grass.addColorStop(0, '#1A5C2A');
  grass.addColorStop(1, '#0E3A19');
  ctx.fillStyle = grass;
  ctx.fillRect(0, H * 0.55, W, H * 0.45);

  // yard lines
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const ly = H * 0.55 + (H * 0.45 * i / 6);
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
  }
  ctx.restore();

  // endzone label
  ctx.save();
  ctx.font = `bold ${Math.round(W * 0.065)}px 'Source Sans 3', sans-serif`;
  ctx.fillStyle = 'rgba(255,184,28,0.09)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('BILLS', W / 2, H * 0.7);
  ctx.restore();
}

function drawGoalPost() {
  const upX = POST_X, baseY = POST_Y + POST_H;

  ctx.save();
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // upright
  ctx.beginPath(); ctx.moveTo(upX, baseY); ctx.lineTo(upX, POST_Y + POST_H * 0.35); ctx.stroke();

  // crossbar
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(upX - POST_W / 2, POST_Y + POST_H * 0.35);
  ctx.lineTo(upX + POST_W / 2, POST_Y + POST_H * 0.35);
  ctx.stroke();

  // left arm
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(upX - POST_W / 2, POST_Y + POST_H * 0.35);
  ctx.lineTo(upX - POST_W / 2, POST_Y);
  ctx.stroke();

  // right arm
  ctx.beginPath();
  ctx.moveTo(upX + POST_W / 2, POST_Y + POST_H * 0.35);
  ctx.lineTo(upX + POST_W / 2, POST_Y);
  ctx.stroke();

  ctx.restore();
}

function drawBall(x, y) {
  ctx.save();
  ctx.fillStyle = '#8B4513';
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(x, y, 11, 7, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // lace
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4);
  ctx.stroke();
  for (let i = -3; i <= 3; i += 2) {
    ctx.beginPath(); ctx.moveTo(x - 3, y + i); ctx.lineTo(x + 3, y + i); ctx.stroke();
  }
  ctx.restore();
}

function drawPowerBar() {
  // bar bg
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(BAR_X - 2, BAR_Y - 2, BAR_W + 4, BAR_H + 4);
  // fill
  const fillW = BAR_W * power;
  const g = ctx.createLinearGradient(BAR_X, 0, BAR_X + BAR_W, 0);
  g.addColorStop(0, '#1B7A40');
  g.addColorStop(0.65, '#E8B800');
  g.addColorStop(1, '#C0392B');
  ctx.fillStyle = g;
  ctx.fillRect(BAR_X, BAR_Y, fillW, BAR_H);
  // border
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(BAR_X, BAR_Y, BAR_W, BAR_H);
  // label
  ctx.fillStyle = WHITE;
  ctx.font = 'bold 11px Source Sans 3, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('POWER', BAR_X, BAR_Y - 5);
  ctx.restore();
}

function drawAccBar() {
  // center line indicator
  const cx = BAR_X + BAR_W / 2;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(BAR_X - 2, BAR_Y - 2, BAR_W + 4, BAR_H + 4);
  // fill color based on how centered
  const off = Math.abs(accuracy - 0.5);
  const c = off < 0.1 ? '#1B7A40' : off < 0.25 ? '#E8B800' : '#C0392B';
  ctx.fillStyle = c;
  ctx.fillRect(BAR_X + BAR_W * accuracy - 6, BAR_Y, 12, BAR_H);
  // border
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(BAR_X, BAR_Y, BAR_W, BAR_H);
  // center marker
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, BAR_Y - 4); ctx.lineTo(cx, BAR_Y + BAR_H + 4);
  ctx.stroke();
  // label
  ctx.fillStyle = WHITE;
  ctx.font = 'bold 11px Source Sans 3, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('ACCURACY', BAR_X, BAR_Y - 5);
  ctx.restore();
}

function drawFrame() {
  ctx.clearRect(0, 0, W, H);
  drawField();
  drawGoalPost();

  if (phase === 'idle' || phase === 'power' || phase === 'accuracy') {
    drawBall(BALL_START_X, BALL_START_Y);
  }
  if (phase === 'power') drawPowerBar();
  if (phase === 'accuracy') drawAccBar();
  if (phase === 'flying') {
    const x = lerp(BALL_START_X, targetX, Math.min(ballT, 1));
    const arc = Math.sin(Math.PI * Math.min(ballT, 1)) * 90;
    const y = lerp(BALL_START_Y, targetY, Math.min(ballT, 1)) - arc;
    drawBall(x, y);
  }
}

// ---- Game logic ----
function startGame() {
  phase = 'idle'; power = 0; powerDir = 1;
  accuracy = 0.5; accDir = 1;
  kickNum = 0; score = 0; results = [];
  document.getElementById('hud-score').textContent = '0';
  document.getElementById('hud-kick').textContent = '1 / 5';
  document.getElementById('end-overlay').classList.remove('open');
  document.getElementById('kick-overlay').classList.remove('open');
  document.getElementById('instr').innerHTML = 'Click to set <strong>power</strong>';
  if (animId) cancelAnimationFrame(animId);
  startKick();
}

function startKick() {
  phase = 'power';
  power = 0; powerDir = 1;
  document.getElementById('instr').innerHTML = 'Click to set <strong>power</strong>';
  loop();
}

function loop() {
  if (phase === 'power') {
    power += 0.015 * powerDir;
    if (power >= 1) { power = 1; powerDir = -1; }
    if (power <= 0) { power = 0; powerDir = 1; }
  } else if (phase === 'accuracy') {
    accuracy += 0.018 * accDir;
    if (accuracy >= 1) { accuracy = 1; accDir = -1; }
    if (accuracy <= 0) { accuracy = 0; accDir = 1; }
  } else if (phase === 'flying') {
    ballT += 0.025;
    if (ballT >= 1) {
      phase = 'done';
      showKickResult();
      drawFrame();
      return;
    }
  }
  drawFrame();
  animId = requestAnimationFrame(loop);
}

function handleClick() {
  if (phase === 'power') {
    phase = 'accuracy';
    accuracy = 0; accDir = 1;
    document.getElementById('instr').innerHTML = 'Click to set <strong>accuracy</strong>';
  } else if (phase === 'accuracy') {
    // determine outcome
    const goodPower = power >= 0.35 && power <= 0.85;
    const accOff = Math.abs(accuracy - 0.5);
    const goodAcc = accOff < 0.22;
    kickGood = goodPower && goodAcc;

    const spread = (accuracy - 0.5) * POST_W * 2.2;
    targetX = POST_X + spread;
    targetY = kickGood ? POST_Y + POST_H * 0.2 : (power < 0.35 ? H * 0.55 + 20 : POST_Y - 30);
    ballT = 0;
    phase = 'flying';
    document.getElementById('instr').innerHTML = '';
  }
}

function showKickResult() {
  kickNum++;
  if (kickGood) score += PTS;
  results.push(kickGood);

  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-kick').textContent = Math.min(kickNum + 1, KICKS) + ' / ' + KICKS;

  const ov = document.getElementById('kick-overlay');
  if (kickGood) {
    document.getElementById('k-emoji').textContent = '🏈';
    document.getElementById('k-title').textContent = 'It\'s Good!';
    document.getElementById('k-sub').textContent = `+${PTS} points — Bills Mafia approves!`;
  } else {
    document.getElementById('k-emoji').textContent = '😬';
    document.getElementById('k-title').textContent = 'No Good!';
    document.getElementById('k-sub').textContent = 'Wide right. Or wide left. Or short. One of those.';
  }

  if (kickNum >= KICKS) {
    document.getElementById('next-btn').textContent = 'See Final Score →';
    document.getElementById('next-btn').onclick = showEnd;
  } else {
    document.getElementById('next-btn').textContent = 'Next Kick →';
    document.getElementById('next-btn').onclick = () => {
      ov.classList.remove('open');
      phase = 'idle';
      setTimeout(startKick, 120);
    };
  }
  ov.classList.add('open');
}

function showEnd() {
  document.getElementById('kick-overlay').classList.remove('open');
  const hist = document.getElementById('e-hist');
  hist.innerHTML = '';
  for (let i = 0; i < KICKS; i++) {
    const chip = document.createElement('span');
    chip.className = 'kick-chip ' + (results[i] ? 'chip-good' : 'chip-miss');
    chip.textContent = results[i] ? `Kick ${i+1} ✓` : `Kick ${i+1} ✗`;
    hist.appendChild(chip);
  }
  const pct = score / (KICKS * PTS);
  let emoji, title, sub;
  if (pct === 1) { emoji = '🏆'; title = 'Perfect Game!'; sub = `${score} / ${KICKS * PTS} pts — Josh Allen would be jealous.`; }
  else if (pct >= 0.67) { emoji = '🏈'; title = 'Nice Leg!'; sub = `${score} / ${KICKS * PTS} pts — Bills Mafia is pleased.`; }
  else if (pct >= 0.33) { emoji = '🤔'; title = 'Needs Work'; sub = `${score} / ${KICKS * PTS} pts — Maybe watch some film first.`; }
  else { emoji = '😔'; title = 'Wide Right Again'; sub = `${score} / ${KICKS * PTS} pts — We don't talk about the Super Bowls.`; }
  document.getElementById('e-emoji').textContent = emoji;
  document.getElementById('e-title').textContent = title;
  document.getElementById('e-sub').textContent = sub;
  document.getElementById('end-overlay').classList.add('open');
}

cvs.addEventListener('click', () => {
  if (phase === 'power' || phase === 'accuracy') handleClick();
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && (phase === 'power' || phase === 'accuracy')) {
    e.preventDefault(); handleClick();
  }
});

// init draw
drawField(); drawGoalPost(); drawBall(BALL_START_X, BALL_START_Y);
document.getElementById('instr').innerHTML = '';

// start button
const startDiv = document.createElement('div');
startDiv.style.cssText = 'position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,10,40,0.88);';
startDiv.innerHTML = `<div style="text-align:center;padding:2rem;max-width:380px">
  <div style="font-size:3rem;margin-bottom:0.75rem">🏈</div>
  <div style="font-size:1.6rem;font-weight:800;color:#FFB81C;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.5rem">Mafia Goal</div>
  <div style="font-size:0.85rem;color:rgba(255,255,255,0.5);line-height:1.6;margin-bottom:1.5rem">5 field goal attempts.<br>Click once to set <strong style="color:#FFB81C">power</strong>, click again to set <strong style="color:#FFB81C">accuracy</strong>.<br>Split the uprights, Bills Mafia style.</div>
  <button style="background:#FFB81C;color:#003087;border:none;font-family:inherit;font-weight:800;font-size:0.9rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.8rem 2rem;border-radius:2px;cursor:pointer;" onclick="this.closest('div[style]').remove();startGame();">Let's Go →</button>
</div>`;
document.body.appendChild(startDiv);
</script>
</body>
</html>
